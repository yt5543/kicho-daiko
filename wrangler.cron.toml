name = "kicho-daiko-cron"
main = "src/cron.ts"
compatibility_date = "2024-10-22"

[[d1_databases]]
binding = "DB"
database_name = "kicho-daiko-db"
database_id = "ab32cce8-c689-484d-933c-136b3804a060"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "kicho-daiko-receipts"

# 毎日1回自動実行するCronトリガー（UTC 21:00 = 日本時間 翌朝06:00）
[triggers]
crons = ["0 21 * * *"]
